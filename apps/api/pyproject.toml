[project]
name = "sg-api"
version = "0.1.0"
description = "SterileGuard FastAPI service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cachetools>=5.5",
    "email-validator>=2.2",
    "fastapi>=0.120",
    "httpx>=0.28",
    "limits>=3.13",
    "pydantic-settings>=2.11",
    "pyjwt[crypto]>=2.10",
    "sg-data",
    "sg-ml",
    "structlog>=25.4",
    "uvicorn[standard]>=0.37",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_api"]

[tool.uv.sources]
sg-data = { workspace = true }
sg-ml = { workspace = true }

[dependency-groups]
dev = [
    "types-cachetools>=7.0.0.20260713",
]
