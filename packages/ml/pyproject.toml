[project]
name = "sg-ml"
version = "0.1.0"
description = "Features, training, evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sg-data",
    "sg-sim",
    "shap>=0.54.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_ml"]

[tool.uv.sources]
sg-data = { workspace = true }
sg-sim = { workspace = true }
