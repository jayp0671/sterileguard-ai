[project]
name = "sg-agents"
version = "0.1.0"
description = "NVIDIA NIM client and agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.11",
    "pyyaml>=6",
    "sg-data",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_agents"]

[tool.uv.sources]
sg-data = { workspace = true }
