name: keepalive

# SG-16: free CPU Spaces sleep when idle and free Supabase projects pause after about a week
# without activity. Every 6 hours: hit /health on the API and run a trivial database query.
# Needs the API_URL variable and the SUPABASE_DB_URL_STAGING secret; each step skips if unset.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
    steps:
      - name: API /health
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL not set: skipped" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # A sleeping Space can take a minute or two to wake: retry for up to 4 minutes.
          for i in $(seq 1 16); do
            if curl -fsS -m 20 "$API_URL/health"; then echo; echo "API awake" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep 15
          done
          echo "API did not answer /health" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Supabase query
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "SUPABASE_DB_URL_STAGING not set: skipped" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -tAc "select count(*) from public.departments" >/dev/null
          echo "Supabase query ok" >> "$GITHUB_STEP_SUMMARY"
