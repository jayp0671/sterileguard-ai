name: deploy-api

# SG-16: push the API build context to the Hugging Face Space (Docker SDK, free CPU). The Space
# builds apps/api/Dockerfile itself. Uses huggingface_hub upload_folder, which the hf CLI wraps
# (checked against the Hugging Face "Managing Spaces with GitHub Actions" docs, Oct 2026).
# Needs the HF_TOKEN secret and the HF_SPACE_ID variable (e.g. jayp671/sterileguard-api).

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/data/**"
      - "packages/ml/**"
      - "packages/sim/**"
      - "packages/agents/**"
      - "uv.lock"
      - "pyproject.toml"
      - "ops/deploy/space/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
    steps:
      - uses: actions/checkout@v5
      - id: ready
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN or HF_SPACE_ID is not set: deploy skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.ready.outputs.run == 'true'
        name: Stage the Space build context
        run: bash ops/deploy/space/stage.sh "$RUNNER_TEMP/space" "${{ github.sha }}"
      - if: steps.ready.outputs.run == 'true'
        name: Upload to the Space
        run: |
          uv run --no-project --with "huggingface_hub>=0.35" python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space"),
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:12]}",
              delete_patterns="*",  # mirror: files removed here are removed on the Space
          )
          PY
      - if: steps.ready.outputs.run == 'true'
        run: echo "Deployed ${GITHUB_SHA::12} to https://huggingface.co/spaces/$HF_SPACE_ID" >> "$GITHUB_STEP_SUMMARY"
