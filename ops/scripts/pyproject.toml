[project]
name = "sg-cli"
version = "0.1.0"
description = "The sg CLI: one entry point for people, CI and agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.19",
    "rich>=14",
    "httpx>=0.28",
    "huggingface_hub>=0.35",
    "psycopg[binary]>=3.2",
    "sqlparse>=0.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_cli"]

[project.scripts]
sg = "sg_cli.main:app"
