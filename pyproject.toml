[project]
name = "sterileguard-workspace"
version = "0.1.0"
description = "SterileGuard AI monorepo (uv workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = ["sg-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/data", "packages/sim", "packages/ml", "packages/agents", "ops/scripts"]

[tool.uv.sources]
sg-api = { workspace = true }
sg-data = { workspace = true }
sg-sim = { workspace = true }
sg-ml = { workspace = true }
sg-agents = { workspace = true }
sg-cli = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.13",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "hypothesis>=6.140",
  "pytest-asyncio>=1.2",
  "polyfactory>=2.22",
  "pandas-stubs>=3.0.5.260914",
  "scipy-stubs>=1.18.1.1",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude/skills", ".agents/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["sg_api", "sg_data", "sg_sim", "sg_ml", "sg_agents", "sg_cli"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "apps/api/src:packages/data/src:packages/sim/src:packages/ml/src:packages/agents/src:ops/scripts/src"
explicit_package_bases = true

# Libraries without type information (scikit-learn ships none).
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "nbformat", "nbclient", "shap"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers -ra"
asyncio_mode = "auto"
markers = [
  "slow: long-running tests (simulation, training); skipped by sg test unit --fast",
  "integration: needs a running database or API",
  "e2e: end-to-end through a browser",
  "nim: replays recorded NVIDIA NIM responses; never calls the live API",
]
testpaths = ["apps/api/tests", "packages/data/tests", "packages/sim/tests", "packages/ml/tests", "packages/agents/tests", "ops/scripts/tests"]

[tool.coverage.run]
# sg_cli is tested but not held to the 80% target (docs/testing.md).
source = ["sg_api", "sg_data", "sg_sim", "sg_ml", "sg_agents"]
branch = true

[tool.coverage.report]
fail_under = 80
skip_empty = true
